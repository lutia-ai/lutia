steps:
    # Step 1: Install dependencies (needed for migrations)
    - name: gcr.io/cloud-builders/npm
      id: install-dependencies
      args: ['ci']

    # Step 2: Generate Prisma Client (needed for migrations)
    - name: gcr.io/cloud-builders/npm
      id: generate-prisma-client
      args: ['run', 'prisma', 'generate']
      waitFor: ['install-dependencies']

    # Step 3: Run database migrations
    - name: gcr.io/cloud-builders/gcloud
      id: run-migrations
      entrypoint: bash
      args:
          - '-c'
          - |
              # Download and start Cloud SQL Proxy in background
              wget -q https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
              chmod +x cloud_sql_proxy
              ./cloud_sql_proxy -instances=${_CLOUD_SQL_INSTANCE}=tcp:5432 &

              # Wait for proxy to be ready
              sleep 5

              # Run Prisma migrations
              npm run prisma:deploy
      env:
          - 'DATABASE_URL=${_DATABASE_URL}'
      waitFor: ['generate-prisma-client']

    # Step 4: Build Docker image (existing step, now runs after migrations)
    - name: gcr.io/cloud-builders/docker
      id: Build
      args:
          - build
          - '--no-cache'
          - '-t'
          - >-
              $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
          - .
          - '-f'
          - Dockerfile
      waitFor: ['run-migrations']

    # Step 5: Push image to Artifact Registry (existing step)
    - name: gcr.io/cloud-builders/docker
      id: Push
      args:
          - push
          - >-
              $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      waitFor: ['Build']

    # Step 6: Deploy to Cloud Run (existing step)
    - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
      id: Deploy
      entrypoint: gcloud
      args:
          - run
          - services
          - update
          - $_SERVICE_NAME
          - '--platform=managed'
          - >-
              --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
          - >-
              --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
          - '--region=$_DEPLOY_REGION'
          - '--quiet'
      waitFor: ['Push']

# Images to push (existing configuration)
images:
    - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

# Options (preserving existing + adding machine type for faster builds)
options:
    substitutionOption: ALLOW_LOOSE
    logging: CLOUD_LOGGING_ONLY
    machineType: E2_HIGHCPU_8

# Substitution variables (existing + new migration variables)
substitutions:
    # Existing variables (already configured in your trigger)
    _AR_HOSTNAME: europe-west1-docker.pkg.dev
    _AR_REPOSITORY: cloud-run-source-deploy
    _AR_PROJECT_ID: lutia-430919
    _PLATFORM: managed
    _SERVICE_NAME: lutia-prod
    _DEPLOY_REGION: europe-west1
    _TRIGGER_ID: 2cb99579-71d8-4f0c-8e5b-a9e0162f99df
    # NEW: Migration-specific variables (you need to add these in trigger config)
    _CLOUD_SQL_INSTANCE: lutia-430919:europe-west1:your-instance-name
    _DATABASE_URL: postgresql://user:password@localhost:5432/lutia-prod?schema=public

# Tags (existing configuration)
tags:
    - gcp-cloud-build-deploy-cloud-run
    - gcp-cloud-build-deploy-cloud-run-managed
    - lutia-prod

# Timeout for entire build (including migrations)
timeout: 1800s
