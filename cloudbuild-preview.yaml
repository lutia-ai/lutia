steps:
    # Step 1: Install dependencies
    - name: gcr.io/cloud-builders/npm
      id: install-dependencies
      args: ['ci', '--silent']

    # Step 2: Generate Prisma Client
    - name: gcr.io/cloud-builders/npm
      id: generate-prisma-client
      args: ['run', 'prisma:generate']
      waitFor: ['install-dependencies']

    # Step 3: Download Cloud SQL Proxy
    - name: gcr.io/cloud-builders/gcloud
      id: download-sql-proxy
      entrypoint: bash
      args:
          - '-c'
          - |
              curl -s -o /workspace/cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
              chmod +x /workspace/cloud_sql_proxy
      waitFor: ['generate-prisma-client']

    # Step 4: Preview Database Migrations
    - name: gcr.io/cloud-builders/npm
      id: preview-migrations
      entrypoint: bash
      args:
          - '-c'
          - |
              # Start Cloud SQL Proxy in background (suppress output)
              /workspace/cloud_sql_proxy -instances=${_CLOUD_SQL_INSTANCE}=tcp:5432 > /dev/null 2>&1 &
              PROXY_PID=$$!

              # Wait for proxy to be ready
              sleep 5

              # Replace the host:port with localhost:5432 (Cloud SQL Proxy endpoint)
              LOCAL_DB_URL=$$(echo "$${DATABASE_URL}" | sed 's/@[^@]*:5432\//@localhost:5432\//')

              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📋 DATABASE MIGRATION PREVIEW"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""

              # Get migration status (only show pending migrations)
              MIGRATE_STATUS=$$(DATABASE_URL="$$LOCAL_DB_URL" npx prisma migrate status 2>&1)

              if echo "$$MIGRATE_STATUS" | grep -q "Following migrations have not yet been applied"; then
                echo "⚠️  Pending Migrations:"
                echo "────────────────────────────────────────────────────────────"
                echo "$$MIGRATE_STATUS" | sed -n '/Following migrations have not yet been applied:/,/^$$/p' | grep "^[0-9]" || true
                echo ""
              else
                echo "✅ No Pending Migrations"
                echo ""
              fi

              # Show SQL diff (only if there are changes)
              DIFF_OUTPUT=$$(npx prisma migrate diff \
                --from-url "$$LOCAL_DB_URL" \
                --to-schema-datamodel prisma/schema.prisma \
                --script 2>&1)

              if [ ! -z "$$DIFF_OUTPUT" ] && ! echo "$$DIFF_OUTPUT" | grep -q "No difference"; then
                echo "📝 SQL Changes:"
                echo "────────────────────────────────────────────────────────────"
                echo "$$DIFF_OUTPUT"
                echo ""
              fi

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              # Kill proxy
              kill $$PROXY_PID || true
      env:
          - 'DATABASE_URL=${_DATABASE_URL}'
      waitFor: ['download-sql-proxy']

# Substitution variables
substitutions:
    _CLOUD_SQL_INSTANCE: 'lutia-430919:europe-west1:lutia'
    _DATABASE_URL: 'postgresql://postgres:VMJ%3EC%3EQ%3F%40MrP%3Ez%7Ed@localhost:5432/lutia-prod?schema=public'

# Options
options:
    substitutionOption: ALLOW_LOOSE
    logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: 600s
