steps:
    # Step 1: Install dependencies
    - name: gcr.io/cloud-builders/npm
      id: install-dependencies
      args: ['ci']

    # Step 2: Generate Prisma Client
    - name: gcr.io/cloud-builders/npm
      id: generate-prisma-client
      args: ['run', 'prisma:generate']
      waitFor: ['install-dependencies']

    # Step 3: Download Cloud SQL Proxy
    - name: gcr.io/cloud-builders/gcloud
      id: download-sql-proxy
      entrypoint: bash
      args:
          - '-c'
          - |
              curl -o /workspace/cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
              chmod +x /workspace/cloud_sql_proxy
      waitFor: ['generate-prisma-client']

    # Step 4: Preview Database Migrations
    - name: gcr.io/cloud-builders/npm
      id: preview-migrations
      entrypoint: bash
      args:
          - '-c'
          - |
              # Start Cloud SQL Proxy in background
              /workspace/cloud_sql_proxy -instances=${_CLOUD_SQL_INSTANCE}=tcp:5432 &
              PROXY_PID=$$!

              # Wait for proxy to be ready
              sleep 5

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📋 DATABASE MIGRATION PREVIEW"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              echo "🔍 Current Migration Status:"
              echo "────────────────────────────────────────────────────────────"
              npx prisma migrate status || true
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📝 Proposed SQL Changes:"
              echo "────────────────────────────────────────────────────────────"

              # Show what would change
              DIFF_OUTPUT=$$(npx prisma migrate diff \
                --from-schema-datasource $${DATABASE_URL} \
                --to-schema-datamodel prisma/schema.prisma \
                --script 2>&1)

              if [ -z "$$DIFF_OUTPUT" ] || echo "$$DIFF_OUTPUT" | grep -q "No difference"; then
                echo "✅ No database changes detected"
                echo ""
                echo "The database schema matches your Prisma schema."
              else
                echo "$$DIFF_OUTPUT"
                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "⚠️  CHANGES DETECTED"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo ""
                echo "The SQL statements above will be executed when you run"
                echo "the 'Apply Migrations' trigger after merging this PR."
              fi

              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✅ Preview completed successfully"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              # Kill proxy
              kill $$PROXY_PID || true
      env:
          - 'DATABASE_URL=${_DATABASE_URL}'
      waitFor: ['download-sql-proxy']

# Substitution variables
substitutions:
    _CLOUD_SQL_INSTANCE: 'lutia-430919:europe-west1:lutia'
    _DATABASE_URL: 'postgresql://postgres:VMJ%3EC%3EQ%3F%40MrP%3Ez%7Ed@localhost:5432/lutia-prod?schema=public'

# Options
options:
    substitutionOption: ALLOW_LOOSE
    logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: 600s
